name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Novo push no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: eventscore
          POSTGRES_PASSWORD: eventscore
          POSTGRES_DB: eventscore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventscore -d eventscore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://eventscore:eventscore@localhost:5432/eventscore

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes unitários
        run: npm test

      - name: Aplicar migrações
        run: npm run db:deploy

      - name: Testes e2e
        run: npm run test:e2e
