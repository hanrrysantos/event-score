openapi: 3.0.3
info:
  title: EventScore - mock do front-end
  version: 0.1.0-front
  description: >
    Mock usado só pelo front (npm run mock). As rotas da Sprint 01 vêm do OpenAPI oficial
    (docs/openapi/openapi-v0.1.yaml). As demais seguem o contrato front x API v0.3 e servem
    de dados de exemplo até o back-end publicar a versão dele; quando publicar, a rota sai daqui.

servers:
  - url: http://localhost:3000/api/v1

security:
  - bearerAuth: []

paths:
  # Sprint 01: OpenAPI oficial do back-end
  /auth/login:
    $ref: '../../docs/openapi/openapi-v0.1.yaml#/paths/~1auth~1login'
  /auth/me:
    $ref: '../../docs/openapi/openapi-v0.1.yaml#/paths/~1auth~1me'
  /eventos:
    $ref: '../../docs/openapi/openapi-v0.1.yaml#/paths/~1eventos'
  /eventos/ativo:
    $ref: '../../docs/openapi/openapi-v0.1.yaml#/paths/~1eventos~1ativo'
  /eventos/{eventoId}:
    $ref: '../../docs/openapi/openapi-v0.1.yaml#/paths/~1eventos~1{eventoId}'
  /eventos/{eventoId}/ativar:
    $ref: '../../docs/openapi/openapi-v0.1.yaml#/paths/~1eventos~1{eventoId}~1ativar'
  /eventos/{eventoId}/dias:
    $ref: '../../docs/openapi/openapi-v0.1.yaml#/paths/~1eventos~1{eventoId}~1dias'
  /eventos/{eventoId}/dias/{diaId}:
    $ref: '../../docs/openapi/openapi-v0.1.yaml#/paths/~1eventos~1{eventoId}~1dias~1{diaId}'
  /eventos/{eventoId}/grupos:
    $ref: '../../docs/openapi/openapi-v0.1.yaml#/paths/~1eventos~1{eventoId}~1grupos'
  /eventos/{eventoId}/grupos/{grupoId}:
    $ref: '../../docs/openapi/openapi-v0.1.yaml#/paths/~1eventos~1{eventoId}~1grupos~1{grupoId}'

  # Contrato v0.3, ainda fora do OpenAPI oficial
  /eventos/{eventoId}/configuracao:
    parameters:
      - $ref: '#/components/parameters/EventoId'
    get:
      summary: Configuração de pontuação do evento (RF02)
      responses:
        '200':
          description: Configuração do evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuracao'
              example:
                conversaoPontoExtra:
                  - { colocacao: 1, pontoExtra: 1.0 }
                  - { colocacao: 2, pontoExtra: 0.8 }
                  - { colocacao: 3, pontoExtra: 0.6 }
                  - { colocacao: 4, pontoExtra: 0.5 }
                  - { colocacao: 5, pontoExtra: 0.4 }
                  - { colocacao: 6, pontoExtra: 0.3 }
                itensBonificacao:
                  - { id: 1, nome: Uniformização, teto: 10 }
                  - { id: 2, nome: Grito de guerra, teto: 10 }
                penalidadeMin: 10
                penalidadeMax: 50
                fatoresPresenca:
                  - { diasPresentes: 2, fator: 1.0 }
                  - { diasPresentes: 1, fator: 0.5 }
                  - { diasPresentes: 0, fator: 0.0 }
                criteriosDesempate:
                  - { ordem: 1, tipo: MAIOR_PONTUACAO_DESAFIO, desafioId: 3, descricao: Maior pontuação no Hackathon }
                  - { ordem: 2, tipo: MENOR_PENALIDADE, desafioId: null, descricao: Menos penalidades }
    put:
      summary: Salva a configuração inteira (idempotente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuracao'
      responses:
        '200':
          description: Configuração salva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuracao'
        '422':
          description: Regra de negócio
          content:
            application/json:
              example: { statusCode: 422, message: A penalidade mínima não pode ser maior que a máxima., error: Unprocessable Entity }

  /eventos/{eventoId}/desafios:
    parameters:
      - $ref: '#/components/parameters/EventoId'
    get:
      summary: Desafios do evento (RF05, RF06)
      responses:
        '200':
          description: Lista de desafios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Desafio'
              example:
                - id: 1
                  nome: Perguntas e Respostas
                  descricao: Rodadas de perguntas sobre computação
                  diaId: 1
                  pontosColocacao: [{ colocacao: 1, pontos: 100 }, { colocacao: 2, pontos: 80 }]
                - id: 3
                  nome: Hackathon
                  descricao: Desenvolvimento em 6 horas
                  diaId: 2
                  pontosColocacao: [{ colocacao: 1, pontos: 100 }, { colocacao: 2, pontos: 80 }]
    post:
      summary: Cadastra desafio com a tabela de pontos (uma linha por grupo, RF06)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalvarDesafio'
      responses:
        '201':
          description: Desafio criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desafio'
              example: { id: 4, nome: Pitch, descricao: Apresentação final, diaId: 2, pontosColocacao: [{ colocacao: 1, pontos: 100 }, { colocacao: 2, pontos: 80 }] }
        '422':
          description: Número de linhas diferente do número de grupos
          content:
            application/json:
              example: { statusCode: 422, message: A tabela de pontos precisa ter uma linha por grupo (6)., error: Unprocessable Entity }

  /eventos/{eventoId}/desafios/{desafioId}:
    parameters:
      - $ref: '#/components/parameters/EventoId'
      - { name: desafioId, in: path, required: true, schema: { type: integer } }
    get:
      summary: Detalhe do desafio
      responses:
        '200':
          description: Desafio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desafio'
              example: { id: 3, nome: Hackathon, descricao: Desenvolvimento em 6 horas, diaId: 2, pontosColocacao: [{ colocacao: 1, pontos: 100 }, { colocacao: 2, pontos: 80 }] }
    patch:
      summary: Altera o desafio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalvarDesafio'
      responses:
        '200':
          description: Desafio alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desafio'
              example: { id: 3, nome: Hackathon, descricao: Desenvolvimento em 6 horas, diaId: 2, pontosColocacao: [{ colocacao: 1, pontos: 100 }, { colocacao: 2, pontos: 80 }] }
    delete:
      summary: Exclui o desafio
      responses:
        '204':
          description: Excluído

  /eventos/{eventoId}/participantes/importacao/previa:
    parameters:
      - $ref: '#/components/parameters/EventoId'
    post:
      summary: Valida a planilha sem gravar nada (RF04)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Arquivo'
      responses:
        '200':
          description: Prévia da importação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviaImportacao'
              example:
                totalLinhas: 6
                linhasValidas: 3
                linhasComErro: 3
                linhas:
                  - { linha: 1, nome: Lucas Vitorino, matricula: '2026-101', turma: ES 2026.2, grupo: Alpha Red, status: VALIDO, motivoErro: null }
                  - { linha: 2, nome: Sofia Moreira, matricula: '2026-102', turma: ES 2026.2, grupo: Alpha Red, status: VALIDO, motivoErro: null }
                  - { linha: 3, nome: Arthur Pires, matricula: '2026-103', turma: CC 2026.2, grupo: Cyber Blue, status: VALIDO, motivoErro: null }
                  - { linha: 15, nome: Camila Ferreira, matricula: '2026-104', turma: ES 2026.2, grupo: Green Matrix, status: ERRO, motivoErro: Matrícula duplicada }
                  - { linha: 22, nome: Rafael Nogueira, matricula: '2026-110', turma: CC 2026.2, grupo: Red Phoenix, status: ERRO, motivoErro: Grupo não existe }
                  - { linha: 40, nome: Pedro Santos, matricula: '2026-115', turma: ES 2026.2, grupo: null, status: ERRO, motivoErro: Grupo obrigatório }

  /eventos/{eventoId}/participantes/importacao:
    parameters:
      - $ref: '#/components/parameters/EventoId'
    post:
      summary: Grava a planilha, só se não houver erro (RF04)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Arquivo'
      responses:
        '201':
          description: Participantes importados. O front não depende do corpo.
          content:
            application/json:
              example: { importados: 71 }
        '422':
          description: A planilha tem erros; devolve as linhas
          content:
            application/json:
              example: { statusCode: 422, message: A planilha tem 4 linhas com erro., error: Unprocessable Entity }

  /eventos/{eventoId}/participantes:
    parameters:
      - $ref: '#/components/parameters/EventoId'
    get:
      summary: Participantes do evento, paginados
      parameters:
        - { name: pagina, in: query, schema: { type: integer, default: 1 } }
        - { name: tamanho, in: query, schema: { type: integer, default: 20 } }
        - { name: grupoId, in: query, schema: { type: integer } }
        - { name: turma, in: query, schema: { type: string } }
        - { name: busca, in: query, schema: { type: string } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                required: [dados, paginacao]
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/Participante'
                  paginacao:
                    $ref: '../../docs/openapi/openapi-v0.1.yaml#/components/schemas/PaginacaoMetaDto'
              example:
                dados:
                  - { id: 1, matricula: '2026-101', nome: Lucas Vitorino, turma: ES 2026.2, grupoId: 1, grupo: Alpha Red }
                  - { id: 2, matricula: '2026-102', nome: Sofia Moreira, turma: ES 2026.2, grupoId: 1, grupo: Alpha Red }
                  - { id: 3, matricula: '2026-103', nome: Arthur Pires, turma: CC 2026.2, grupoId: 2, grupo: Cyber Blue }
                paginacao: { pagina: 1, tamanho: 20, totalItens: 72, totalPaginas: 4 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventoId:
      name: eventoId
      in: path
      required: true
      schema: { type: integer }
  schemas:
    Configuracao:
      type: object
      required: [conversaoPontoExtra, itensBonificacao, penalidadeMin, penalidadeMax, fatoresPresenca, criteriosDesempate]
      properties:
        conversaoPontoExtra:
          type: array
          items:
            type: object
            required: [colocacao, pontoExtra]
            properties:
              colocacao: { type: integer, minimum: 1 }
              pontoExtra: { type: number, minimum: 0 }
        itensBonificacao:
          type: array
          items:
            type: object
            required: [nome, teto]
            properties:
              id: { type: integer, description: Ausente em item novo }
              nome: { type: string, minLength: 1 }
              teto: { type: integer, minimum: 1 }
        penalidadeMin: { type: integer, minimum: 0 }
        penalidadeMax: { type: integer, minimum: 0 }
        fatoresPresenca:
          type: array
          items:
            type: object
            required: [diasPresentes, fator]
            properties:
              diasPresentes: { type: integer, minimum: 0 }
              fator: { type: number, minimum: 0, maximum: 1 }
        criteriosDesempate:
          type: array
          items:
            type: object
            required: [ordem, tipo, descricao]
            properties:
              ordem: { type: integer, minimum: 1 }
              tipo:
                type: string
                enum: [MAIOR_PONTUACAO_DESAFIO, MAIOR_SOMA_DESAFIOS, MAIOR_BONIFICACAO, MENOR_PENALIDADE, MAIOR_PRESENCA]
              desafioId: { type: integer, nullable: true }
              descricao: { type: string }
    Arquivo:
      type: object
      required: [arquivo]
      properties:
        arquivo: { type: string, format: binary, description: .csv (UTF-8, vírgula ou ponto e vírgula) ou .xlsx, até 5 MB }
    PreviaImportacao:
      type: object
      required: [totalLinhas, linhasValidas, linhasComErro, linhas]
      properties:
        totalLinhas: { type: integer }
        linhasValidas: { type: integer }
        linhasComErro: { type: integer }
        linhas:
          type: array
          items:
            type: object
            required: [linha, nome, matricula, turma, grupo, status, motivoErro]
            properties:
              linha: { type: integer }
              nome: { type: string, nullable: true }
              matricula: { type: string, nullable: true }
              turma: { type: string, nullable: true }
              grupo: { type: string, nullable: true }
              status: { type: string, enum: [VALIDO, ERRO] }
              motivoErro: { type: string, nullable: true }
    Participante:
      type: object
      required: [id, matricula, nome, turma, grupoId, grupo]
      properties:
        id: { type: integer }
        matricula: { type: string }
        nome: { type: string }
        turma: { type: string }
        grupoId: { type: integer }
        grupo: { type: string }
    SalvarDesafio:
      type: object
      properties:
        nome: { type: string, minLength: 1 }
        descricao: { type: string }
        diaId: { type: integer }
        pontosColocacao:
          type: array
          items:
            type: object
            required: [colocacao, pontos]
            properties:
              colocacao: { type: integer, minimum: 1 }
              pontos: { type: integer, minimum: 0 }
    Desafio:
      type: object
      required: [id, nome, descricao, diaId, pontosColocacao]
      properties:
        id: { type: integer }
        nome: { type: string }
        descricao: { type: string }
        diaId: { type: integer }
        pontosColocacao:
          type: array
          items:
            type: object
            required: [colocacao, pontos]
            properties:
              colocacao: { type: integer }
              pontos: { type: integer }
